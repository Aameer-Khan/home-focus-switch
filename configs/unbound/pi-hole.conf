# /etc/unbound/unbound.conf.d/pi-hole.conf
# Unbound sits behind Pi-hole and forwards allowed lookups to Cloudflare
# (Quad9 as backup) over DNS-over-TLS on port 853, so the ISP can't read them.
# Pi-hole upstream: 127.0.0.1#5335
server:
    interface: 127.0.0.1        # only Pi-hole on this machine can reach it
    port: 5335                  # 53 is taken by Pi-hole
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
    edns-buffer-size: 1232

forward-zone:
    name: "."
    forward-tls-upstream: yes   # encrypt every upstream query
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 9.9.9.9@853#dns.quad9.net
